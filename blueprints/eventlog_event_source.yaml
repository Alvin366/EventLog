blueprint:
  name: EventLog - Event Source
  description: |
    Template blueprint for creating custom event sources for EventLog.

    Use this blueprint to automatically log events from device states,
    sensor values, or any Home Assistant automation. Creates a bridge between
    your automations and EventLog for centralized event management.

    Features:
    • Monitor any entity for state changes
    • Send events to EventLog automatically
    • Configurable event title and message templates
    • Custom deduplication keys
    • Works with any sensor or binary_sensor

    Example uses:
    - Monitor battery sensors → log low battery events
    - Watch device connectivity → log offline/online events
    - Track climate sensors → log temperature alerts
    - Monitor plant moisture → log watering reminders
    - Custom automations → send to EventLog

  domain: automation
  source_url: https://github.com/Alvin366/EventLog/blob/main/blueprints/eventlog_event_source.yaml

  input:
    trigger_entity:
      name: Entity to Monitor
      description: Entity whose state changes will trigger events
      selector:
        entity:

    trigger_condition:
      name: Trigger Condition
      description: When should this create an event?
      default: state_change
      selector:
        select:
          options:
            - state_change
            - below_value
            - above_value

    trigger_value:
      name: Trigger Value (for below/above)
      description: Threshold value for numeric conditions
      default: 50
      selector:
        number:
          min: 0
          max: 100

    event_title:
      name: Event Title Template
      description: |
        Title for the event. Use {{ entity_id }}, {{ old_state }}, {{ new_state }}
        Example: "{{ state_attr('binary_sensor.kitchen_door', 'friendly_name') }} opened"
      selector:
        text:

    event_message:
      name: Event Message Template
      description: |
        Message body. Use {{ entity_id }}, {{ old_state }}, {{ new_state }}
        Example: "State changed from {{ old_state }} to {{ new_state }}"
      selector:
        text:

    event_category:
      name: Event Category
      description: Category for this event (for organization)
      default: devices
      selector:
        text:
          placeholder: "e.g., devices, climate, security"

    event_severity:
      name: Event Severity
      description: How important is this event?
      default: minor
      selector:
        select:
          options:
            - critical
            - major
            - minor
            - warning
            - log

    dedup_key:
      name: Deduplication Key
      description: |
        Unique identifier to prevent exact duplicates.
        Use {{ entity_id }} to include entity in key.
      default: "{{ entity_id }}_event"
      selector:
        text:

trigger:
  - platform: state
    entity_id: !input trigger_entity

condition:
  - condition: template
    value_template: >-
      {%- set condition = !input trigger_condition -%}
      {%- set entity = !input trigger_entity -%}
      {%- set current = states(entity) -%}
      {%- if condition == 'state_change' -%}
        true
      {%- elif condition == 'below_value' -%}
        {{ current | float(-999) < (!input trigger_value | float) }}
      {%- elif condition == 'above_value' -%}
        {{ current | float(999) > (!input trigger_value | float) }}
      {%- endif -%}

action:
  # Fire event to EventLog with event data
  - event: eventlog.log_event
    event_data:
      category: !input event_category
      title: !input event_title
      message: !input event_message
      dedup_key: !input dedup_key

mode: queued
max_exceeded: silent
