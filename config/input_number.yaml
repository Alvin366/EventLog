# EventLog Input Number Helpers
# Configuration values for EventLog behavior

eventlog_archive_days:
  name: "Archive After (days)"
  min: 1
  max: 90
  step: 1
  unit_of_measurement: "days"
  icon: mdi:calendar-range
  initial: 7

eventlog_dedup_window:
  name: "Deduplication Window (seconds)"
  min: 30
  max: 3600
  step: 30
  unit_of_measurement: "s"
  icon: mdi:timer
  initial: 300

eventlog_auto_resolve_timeout:
  name: "Auto Resolve Timeout (seconds)"
  min: 300
  max: 604800
  step: 300
  unit_of_measurement: "s"
  icon: mdi:timer-outline
  initial: 86400

eventlog_max_events:
  name: "Maximum Events to Keep"
  min: 10
  max: 1000
  step: 10
  icon: mdi:counter
  initial: 100

eventlog_scan_interval:
  name: "Log File Scan Interval (seconds)"
  min: 10
  max: 300
  step: 10
  unit_of_measurement: "s"
  icon: mdi:timer-sand
  initial: 60
