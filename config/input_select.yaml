# EventLog Input Select Helpers
# For category and status selection

eventlog_category:
  name: "Event Category"
  icon: mdi:tag
  options:
    - critical
    - major
    - minor
    - warning
    - log
  initial: log

eventlog_status:
  name: "Event Status"
  icon: mdi:progress-check
  options:
    - active
    - acknowledged
    - closed
  initial: active

eventlog_min_level:
  name: "Minimum Event Level to Display"
  icon: mdi:filter
  options:
    - critical
    - major
    - minor
    - warning
    - log
  initial: log

eventlog_display_mode:
  name: "Event Display Mode"
  icon: mdi:view-list
  options:
    - compact
    - detailed
    - minimal
  initial: compact

eventlog_sort_by:
  name: "Sort Events By"
  icon: mdi:sort-ascending
  options:
    - last_occurrence
    - first_occurrence
    - category
    - title
  initial: last_occurrence
