# EventLog Dashboard Card for Valiug
# Add this to your Valiug dashboard YAML

type: custom:layout-card
layout_type: vertical
cards:
  - type: heading
    heading: System Events
    subheading: EventLog - Centralized Event Management

  - type: horizontal-stack
    cards:
      - type: custom:button-card
        entity: input_boolean.eventlog_enabled
        name: EventLog Status
        show_state: true
        show_label: true
        label: |
          [[[
            return entity.state === 'on' ? 'Enabled' : 'Disabled';
          ]]]
        styles:
          card:
            - background-color: |
                [[[
                  return entity.state === 'on' ? 'rgba(76, 175, 80, 0.2)' : 'rgba(244, 67, 54, 0.2)';
                ]]]

      - type: custom:button-card
        entity: input_select.eventlog_min_level
        name: Filter Level
        show_state: true

      - type: custom:button-card
        entity: input_select.eventlog_display_mode
        name: Display Mode
        show_state: true

  - type: entities
    title: Active Events
    entities:
      - entity: input_text.eventlog_active_events
        name: Current Events
        attribute: value
    state_format: |
      [[[
        try {
          const events = JSON.parse(state);
          if (!Array.isArray(events)) return '0 events';
          return `${events.length} active event${events.length !== 1 ? 's' : ''}`;
        } catch(e) {
          return '0 events';
        }
      ]]]

  # Event list display (template-based)
  - type: custom:template-entity-row
    entity: input_text.eventlog_active_events
    name: Event List
    content: |
      [[[
        try {
          const events = JSON.parse(entity_id('input_text.eventlog_active_events').state);
          if (!Array.isArray(events) || events.length === 0) {
            return 'No active events';
          }

          const maxEvents = 10;
          let html = '<div style="font-family: monospace; font-size: 11px; line-height: 1.4;">';

          events.slice(0, maxEvents).forEach(evt => {
            const colors = {
              critical: '#d32f2f',
              major: '#f57c00',
              minor: '#fbc02d',
              warning: '#1976d2',
              log: '#616161'
            };

            const color = colors[evt.category] || '#666';
            const time = new Date(evt.last_occurrence).toLocaleTimeString();
            const count = evt.occurrence_count > 1 ? ` (×${evt.occurrence_count})` : '';

            html += `<div style="margin: 4px 0; padding: 4px; border-left: 3px solid ${color}; background: rgba(0,0,0,0.05);">`;
            html += `<span style="color: ${color}; font-weight: bold;">[${evt.category.toUpperCase()}]</span> `;
            html += `${evt.title}${count}<br>`;
            html += `<span style="color: #999; font-size: 10px;">${time} - ${evt.message}</span>`;
            html += `</div>`;
          });

          if (events.length > maxEvents) {
            html += `<div style="margin: 4px 0; padding: 4px; color: #999;">... and ${events.length - maxEvents} more</div>`;
          }

          html += '</div>';
          return html;
        } catch(e) {
          return 'Error rendering events';
        }
      ]]]

  - type: custom:hui-element
    element_type: ha-card
    card_mod:
      style:
        ha-card$: |
          .card-header {
            display: none;
          }
    elements:
      - type: custom:template-entity-row
        entity: input_text.eventlog_active_events
        name: Statistics
        content: |
          [[[
            try {
              const events = JSON.parse(entity_id('input_text.eventlog_active_events').state);
              const acked = JSON.parse(entity_id('input_text.eventlog_acknowledged_events').state);
              const archive = JSON.parse(entity_id('input_text.eventlog_archive').state);

              if (!Array.isArray(events)) return 'No data';

              const stats = {
                critical: events.filter(e => e.category === 'critical').length,
                major: events.filter(e => e.category === 'major').length,
                minor: events.filter(e => e.category === 'minor').length,
                warning: events.filter(e => e.category === 'warning').length,
                log: events.filter(e => e.category === 'log').length,
              };

              return `Critical: ${stats.critical} | Major: ${stats.major} | Minor: ${stats.minor} | Warning: ${stats.warning} | Log: ${stats.log}`;
            } catch(e) {
              return 'Error';
            }
          ]]]

# Alternative: Simple markdown card
  - type: markdown
    content: |
      ## Event Log Summary

      ### Configuration
      - **Status**: {{ state_attr('input_boolean.eventlog_enabled', 'value') }}
      - **Archive Period**: {{ state_attr('input_number.eventlog_archive_days', 'value') }} days
      - **Dedup Window**: {{ state_attr('input_number.eventlog_dedup_window', 'value') }} seconds
      - **Display Mode**: {{ state_attr('input_select.eventlog_display_mode', 'value') }}

      ### Quick Actions
      - [Enable/Disable EventLog](javascript:alert('Toggle via UI'))
      - [Clear Active Events](javascript:alert('Use Developer Tools'))
      - [View Archive](javascript:alert('Check input_text.eventlog_archive'))

# Entity cards for helpers
  - type: entities
    title: Helper Configuration
    collapsed: true
    entities:
      - entity: input_select.eventlog_min_level
        name: Minimum Display Level
      - entity: input_select.eventlog_sort_by
        name: Sort By
      - entity: input_number.eventlog_archive_days
        name: Archive Period
      - entity: input_number.eventlog_dedup_window
        name: Dedup Window
      - entity: input_boolean.eventlog_show_closed
        name: Show Closed Events
      - entity: input_boolean.eventlog_auto_archive
        name: Auto Archive

  - type: entities
    title: InfluxDB Configuration
    collapsed: true
    entities:
      - entity: input_boolean.eventlog_enable_influxdb
        name: Enable InfluxDB
      - entity: input_text.eventlog_influxdb_url
        name: InfluxDB URL
      - entity: input_text.eventlog_influxdb_user
        name: InfluxDB User
      - entity: input_text.eventlog_influxdb_password
        name: InfluxDB Password
